{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    {% for product in products %}
    <div class="col-md-4">
        <article class="card h-100 product-card">
            <div class="card-body d-flex flex-column">
                <h2 class="h5 card-title">{{ product.name }}</h2>
                <p class="card-text">{{ product.content }}</p>
                <p class="product-price mt-auto">${{ product.price }}</p>
                <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                   class="btn btn-primary">Детальніше</a>
            </div>
        </article>
    </div>
    {% endfor %}
</div>
{% endblock %}
