{% extends "base.html" %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-danger">
        <div class="card-body p-4">
            <h2 class="text-danger">Підтвердження видалення</h2>
            <p class="lead">Ви дійсно хочете видалити пост <strong>"{{ post.title }}"</strong>?</p>

            <form method="POST" class="mt-4 d-flex gap-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-danger">Так, видалити</button>
                <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary">Скасувати</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
