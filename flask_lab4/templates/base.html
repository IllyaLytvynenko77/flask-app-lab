<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Лабораторна робота №4{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="navbar">
        <a class="brand" href="{{ url_for('index') }}">Мій сайт</a>
        <nav>
            <a href="{{ url_for('index') }}">Головна</a>
            <a href="{{ url_for('login') }}">Вхід</a>
            {% if session.get('username') %}
                <a href="{{ url_for('profile') }}">Профіль</a>
                <form class="nav-form" action="{{ url_for('logout') }}" method="post">
                    <button class="nav-button" type="submit">Вийти</button>
                </form>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
