<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Лабораторна робота №5 — Flask-WTF{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Flask Lab 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-warning" href="{{ url_for('contact') }}">Контакти (/contact)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('products.list_products') }}">Товари (/product)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('products.add_product') }}">+ Додати товар</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% for cat, msg in get_flashed_messages(True) %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
